{% load static %}
<nav class="navbar">
    <div class="navbar__container">
        <a href="{% if user.is_authenticated %}{% url 'shorts_app:index' %}{% else %}{% url 'shorts_app:home' %}{% endif %}" class="navbar__brand">
            <svg class="navbar__logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
                <defs>
                    <linearGradient id="navLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color: #6a11cb;"/>
                        <stop offset="100%" style="stop-color: #2575fc;"/>
                    </linearGradient>
                </defs>
                <path fill="url(#navLogoGrad)" d="M85.3,17.6c-4.6-4.6-10.8-7.1-17.3-7.1H32c-6.5,0-12.7,2.5-17.3,7.1C10.1,22.2,7.6,28.4,7.6,35v30 c0,6.5,2.5,12.7,7.1,17.3s10.8,7.1,17.3,7.1h36c6.5,0,12.7-2.5,17.3-7.1s7.1-10.8,7.1-17.3V35C92.4,28.4,89.9,22.2,85.3,17.6z M65,52.5l-20,12.5c-1.7,1.1-3.9-0.3-3.9-2.5V37.5c0-2.2,2.1-3.6,3.9-2.5l20,12.5C66.7,48.6,66.7,51.4,65,52.5z"/>
            </svg>
            <span class="navbar__title">ClipCraft <span class="navbar__title-accent">AI</span></span>
        </a>

        <button class="navbar__toggle" aria-label="Toggle navigation menu">
            <span></span><span></span><span></span>
        </button>

        <div class="navbar__links">
            {% if user.is_authenticated %}
                <a href="{% url 'shorts_app:index' %}" class="navbar__link {% if request.resolver_match.url_name == 'index' %}active{% endif %}">Dashboard</a>
                <a href="{% url 'shorts_app:pricing' %}" class="navbar__link {% if request.resolver_match.url_name == 'pricing' %}active{% endif %}">Pricing</a>
                <div class="navbar__user">
                    <span class="navbar__user-name">{{ user.username }}</span>
                    <a href="{% url 'shorts_app:logout' %}" class="navbar__link navbar__link--logout">Logout</a>
                </div>
            {% else %}
                <a href="{% url 'shorts_app:home' %}" class="navbar__link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
                <a href="{% url 'shorts_app:pricing' %}" class="navbar__link {% if request.resolver_match.url_name == 'pricing' %}active{% endif %}">Pricing</a>
                <a href="{% url 'shorts_app:login' %}" class="navbar__link">Login</a>
                <a href="{% url 'shorts_app:register' %}" class="btn btn-primary navbar__cta">Get Started</a>
            {% endif %}
        </div>
    </div>
</nav>
