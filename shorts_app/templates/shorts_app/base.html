<html lang="en">

</head>
<body>
    {% include 'shorts_app/components/navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'shorts_app/components/footer.html' %}

    <script src="{% static 'shorts_app/js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
