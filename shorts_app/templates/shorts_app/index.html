<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Factory</title>
    <style>
        :root { --primary-color: #4a90e2; --secondary-color: #50e3c2; --bg-color: #f4f7f6; --card-bg: #ffffff; --text-color: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .page-header { display: flex; align-items: center; max-width: 800px; margin: 0 auto 20px auto; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 24px; color: var(--primary-color); }
        .logo svg { width: 40px; height: 40px; }
        .container { background-color: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 800px; margin: auto; }
        h1, h2 { color: #2c3e50; text-align: center; }
        .section { margin-bottom: 30px; border-bottom: 1px solid #e0e0e0; padding-bottom: 30px; }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        button { background-color: var(--primary-color); color: white; padding: 14px 22px; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: 600; transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover:not(:disabled) { background-color: #357abd; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        #video_url { padding: 16px; font-size: 17px; border: 1px solid #ddd; border-radius: 8px; background-color: #f8f9fa; transition: all 0.3s; }
        #video_url:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.2); }
        .format-options { display: flex; gap: 20px; justify-content: flex-start; margin: 10px 0; }

        /* Marquee Scroller */
        .recent-videos-wrapper { padding: 20px 0; }
        .marquee { overflow: hidden; position: relative; width: 100%; -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); }
        .marquee-content { display: flex; width: fit-content; animation: scroll 40s linear infinite; }
        .marquee:hover .marquee-content { animation-play-state: paused; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .video-card { flex: 0 0 220px; margin: 0 10px; border-radius: 12px; overflow: hidden; transition: all 0.3s; background: var(--card-bg); box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .video-card img { width: 100%; height: 120px; object-fit: cover; background-color: #eee; }
        .video-card .card-content { padding: 12px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .video-card p { font-size: 14px; font-weight: 600; margin: 0 0 10px 0; }
        .video-card .card-actions { display: flex; gap: 10px; justify-content: center; }
        .card-btn { font-size: 14px; padding: 6px 12px; }
        .use-btn { background-color: var(--secondary-color); }
        .use-btn:hover { background-color: #48c9b0; }

        /* Thumbnail Placeholder */
        .placeholder-thumbnail { width: 100%; height: 120px; background: linear-gradient(45deg, #e0e0e0, #f0f0f0); display: flex; align-items: center; justify-content: center; }
        .placeholder-thumbnail span { font-size: 48px; font-weight: bold; color: #aaa; }

        /* Video Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 90%; max-height: 90%; position: relative; }
        .modal-close { position: absolute; top: -15px; right: -15px; background: white; border-radius: 50%; width: 30px; height: 30px; border: none; font-size: 20px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .modal-video { max-width: 80vw; max-height: 80vh; }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v16H4V4m2 2v3h12V6H6m0 5v3h12v-3H6m0 5v3h12v-3H6z"></path></svg>
            <span>Video Factory</span>
        </div>
    </header>

    <div class="container">
        <div id="downloadSection" class="section">
            <h2>1. Start with a YouTube Video</h2>
            <div class="input-group">
                <label for="video_url">YouTube Link</label>
                <input type="text" id="video_url" placeholder="Paste a YouTube video URL here">
            </div>
            <div class="input-group">
                <label>Desired Output Format</label>
                <div class="format-options">
                    <label><input type="radio" name="video_format_initial" value="short" checked> Short (9:16)</label>
                    <label><input type="radio" name="video_format_initial" value="standard"> Standard (16:9)</label>
                </div>
            </div>
            <button id="downloadBtn">Download & Analyze</button>
            <div id="downloadProgress" class="progress-container hidden">
                <p id="downloadStatus" style="text-align:center; font-weight: 500;"></p>
                <progress id="downloadProgressBar" value="0" max="100"></progress>
            </div>
        </div>

        <div class="recent-videos-wrapper section">
            <h2>Or, pick up where you left off...</h2>
            <div class="marquee">
                <div class="marquee-content">
                    {% if recent_videos %}{% for video in recent_videos %}{% include "shorts_app/video_card.html" %}{% endfor %}{% for video in recent_videos %}{% include "shorts_app/video_card.html" %}{% endfor %}{% endif %}
                </div>
            </div>
        </div>

        <div id="generateSection" class="section hidden"></div>
        <div id="outputSection" class="section hidden"></div>
    </div>

    <div id="videoModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">×</button>
            <video id="modalVideoPlayer" class="modal-video" controls autoplay></video>
        </div>
    </div>

    <template id="generate-template">
        <h2>2. Create Your Clip</h2>
        <p><strong>Title:</strong> <span class="video-title"></span></p>
        <div class="suggested-clips"></div>
        <div class="input-group" style="margin-top: 20px;">
            <label>Or Trim Manually</label>
            <div style="display: flex; gap: 15px;">
                <input type="text" class="start-time" placeholder="Start (MM:SS)">
                <input type="text" class="end-time" placeholder="End (MM:SS)">
            </div>
        </div>
        <button class="generate-btn">Generate Video</button>
        <div class="generate-progress progress-container hidden">
            <p class="generate-status" style="text-align:center; font-weight: 500;"></p>
            <progress class="generate-progress-bar" value="0" max="100"></progress>
        </div>
    </template>
    <template id="output-template">
        </template>

    <script>
        const get = id => document.getElementById(id);
        const csrfToken = '{{ csrf_token }}';
        let downloadedVideoData = null;

        // --- Modal Functions ---
        const playVideoInModal = (videoPath) => {
            get('modalVideoPlayer').src = videoPath;
            get('videoModal').style.display = 'flex';
        };
        const closeModal = () => {
            get('modalVideoPlayer').pause();
            get('modalVideoPlayer').src = '';
            get('videoModal').style.display = 'none';
        };

        // --- Job Polling & UI ---
        const pollJobStatus = (jobId, progressDiv, progressBar, statusP, onComplete) => {
            progressDiv.style.display = 'block';
            const interval = setInterval(async () => {
                const response = await fetch(`/check_job_status/?job_id=${jobId}`);
                const data = await response.json();
                if (data.status === 'not_found') return;
                statusP.textContent = data.message;
                progressBar.value = data.progress;
                if (data.status === 'completed' || data.status === 'failed') {
                    clearInterval(interval);
                    progressDiv.style.display = 'none';
                    if (data.status === 'completed') onComplete(data.result);
                }
            }, 2000);
        };

        const populateGenerateUI = (data) => {
            const generateSection = get('generateSection');
            const template = get('generate-template').content.cloneNode(true);
            generateSection.innerHTML = '';
            generateSection.appendChild(template);

            downloadedVideoData = data;
            generateSection.querySelector('.video-title').textContent = data.video_title;
            const end = data.video_duration;
            generateSection.querySelector('.end-time').value = `${Math.floor(end/60).toString().padStart(2, '0')}:${(end%60).toString().padStart(2, '0')}`;

            // **FIXED**: Correctly populate suggestions
            const clipsContainer = generateSection.querySelector('.suggested-clips');
            if (data.suggested_clips && data.suggested_clips.length > 0) {
                clipsContainer.innerHTML = '<h3>Suggestions</h3>';
                data.suggested_clips.forEach(clip => {
                    const box = document.createElement('div');
                    box.className = 'clip-box'; // Add styles for this class if needed
                    box.innerHTML = `<p>${clip.description}</p><small>(${clip.start} - ${clip.end})</small>`;
                    box.onclick = () => {
                        generateSection.querySelector('.start-time').value = clip.start;
                        generateSection.querySelector('.end-time').value = clip.end;
                    };
                    clipsContainer.appendChild(box);
                });
            } else {
                clipsContainer.innerHTML = ''; // Clear if no suggestions
            }

            generateSection.classList.remove('hidden');
            generateSection.querySelector('.generate-btn').addEventListener('click', handleGenerateClick);
        };

        const reuseVideo = (title, duration, path) => {
            populateGenerateUI({
                video_title: title,
                video_duration: parseInt(duration),
                video_path: path,
                suggested_clips: [] // Re-analyze to get suggestions
            });
            window.scrollTo({ top: get('downloadSection').offsetHeight, behavior: 'smooth' });
        };

        get('downloadBtn').addEventListener('click', async () => {
            const videoUrl = get('video_url').value;
            if (!videoUrl) return;
            const response = await fetch('/start_download_job/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ video_url: videoUrl })
            });
            const data = await response.json();
            if (data.status === 'success') {
                pollJobStatus(get('downloadBtn').nextElementSibling, get('downloadProgressBar'), get('downloadStatus'), populateGenerateUI);
            }
        });

        const handleGenerateClick = async () => {
            const generateSection = get('generateSection');
            // Read format from Step 1
            const videoFormat = document.querySelector('input[name="video_format_initial"]:checked').value;

            const payload = {
                video_path: downloadedVideoData.video_path,
                start_time: generateSection.querySelector('.start-time').value,
                end_time: generateSection.querySelector('.end-time').value,
                video_format: videoFormat
            };
            const response = await fetch('/start_generate_job/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (data.status === 'success') {
                pollJobStatus(
                    generateSection.querySelector('.generate-progress'),
                    generateSection.querySelector('.generate-progress-bar'),
                    generateSection.querySelector('.generate-status'),
                    (result) => {
                        const outputSection = get('outputSection');
                        const template = get('output-template').content.cloneNode(true);
                        outputSection.innerHTML = '';
                        outputSection.appendChild(template);
                        outputSection.querySelector('.generated-video').src = result.short_url;
                        outputSection.querySelector('.final-download-link').href = result.short_url;
                        outputSection.classList.remove('hidden');
                        // updateQuotaDisplay();
                    }
                );
            }
        };

        // document.addEventListener('DOMContentLoaded', updateQuotaDisplay);
    </script>
</body>
</html>
